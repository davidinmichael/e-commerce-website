{% extends "admin_base.html" %} {% load static %} {% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">Product Categories</h4>
    <a href="#addCategoryFormContainer" class="btn btn-primary">+ Add Category</a>
  </div>

  <div class="row g-4">
    {% for category in categories %}
    <div class="col-md-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h5>{{ category.name }}</h5>
          <p>{{ category.description }}</p>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

   <div class="container" id="addCategoryFormContainer">
    <div class="d-flex justify-content-between align-items-center mb-2 mt-5">
      <h2 class="fw-bold">Add Category</h2>
    </div>

    <form
      id="addCategoryForm"
      method="POST"
	  action="{% url 'categories' %}"
      class="card p-4 shadow-sm border-0"
    >
      {% csrf_token %}
      <div class="row g-3">
        <!-- Title -->
        <div class="col-md-6">
          <label for="title" class="form-label fw-semibold"
            >Category Name</label
          >
          <input
            type="text"
            name="name"
            id="title"
            class="form-control"
            placeholder="Enter category name"
            required
          />
        </div>

        <!-- Description -->
        <div class="col-12">
          <label for="description" class="form-label fw-semibold"
            >Description</label
          >
          <textarea
            name="description"
            id="description"
            class="form-control"
            rows="4"
            placeholder="Write a short description"
          ></textarea>
        </div>


        <!-- Submit -->
        <div class="col-12 text-end mt-4">
          <button type="submit" class="btn btn-primary px-5">
            Save Category
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
